name: probe-x
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: X sources from runner
        run: |
          echo "== apkpure XAPK latest"
          curl -s -o /tmp/x.xapk -w "%{http_code} size=%{size_download} -> %{filename_effective}\n" -L --max-time 120 "https://d.apkpure.net/b/XAPK/com.twitter.android?version=latest"
          echo "  ABIs in bundle:"; unzip -Z1 /tmp/x.xapk 2>/dev/null | grep -oE "lib/[a-zA-Z0-9_-]+/" | sort -u || echo "  (not a zip / list failed)"
          unzip -Z1 /tmp/x.xapk 2>/dev/null | grep -E "\.apk$" | head -8
          echo "== apkpure APK latest"
          curl -s -o /tmp/x2.apk -w "%{http_code} size=%{size_download} -> %{filename_effective}\n" -L --max-time 120 "https://d.apkpure.net/b/APK/com.twitter.android?version=latest"
          file /tmp/x2.apk | head -1
          unzip -l /tmp/x2.apk 2>/dev/null | grep -oE "lib/[a-zA-Z0-9_-]+/" | sort -u | head
          echo "== uptodown"
          curl -s -o /tmp/ux.html -w "  %{http_code}\n" -A "Mozilla/5.0 Chrome/131" --max-time 30 "https://x-twitter.en.uptodown.com/android/versions"
          grep -oE '12\.[0-9]+\.[0-9]+-release' /tmp/ux.html | sort -u | head -8
          curl -s -o /tmp/ut.html -w "  %{http_code}\n" -A "Mozilla/5.0 Chrome/131" --max-time 30 "https://twitter.en.uptodown.com/android/versions"
          grep -oE '12\.[0-9]+\.[0-9]+-release' /tmp/ut.html | sort -u | head -8
