name: probe-src
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install apkeep
        run: |
          wget -qO apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep && sudo -S -p '' mv apkeep /usr/local/bin/
      - name: Test apkeep pinned (ack env)
        run: |
          export APKEEP_ACK_APKPURE_DANGERS=true
          timeout 120 apkeep -a com.google.android.youtube@21.30.216 -d apk-pure . && ls -la *.apk *.xapk 2>/dev/null || echo "APKEEP_PINNED_FAILED rc=$?"
      - name: Test apkeep unpinned
        run: |
          rm -f *.apk *.xapk
          export APKEEP_ACK_APKPURE_DANGERS=true
          timeout 120 apkeep -a com.google.android.youtube -d apk-pure . && ls -la *.apk *.xapk 2>/dev/null || echo "APKEEP_UNPINNED_FAILED rc=$?"
      - name: Test d.apkpure.net CDN latest
        run: |
          for pkg in com.google.android.youtube com.google.android.apps.youtube.music com.reddit.frontpage com.instagram.android; do
            echo "== $pkg"
            curl -s -o /dev/null -w "%{http_code} %{url_effective} -> %{filename_effective}\n" -L --max-time 60 "https://d.apkpure.net/b/XAPK/${pkg}?version=latest" || echo "CURL_FAIL"
          done
