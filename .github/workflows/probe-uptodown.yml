name: probe-uptodown
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe uptodown
        run: |
          for slug in youtube youtube-app youtube-android; do
            echo "== $slug"
            curl -s -o /tmp/u.html -w "  %{http_code}\n" -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131" --max-time 30 "https://$slug.en.uptodown.com/android"
            grep -oE '21\.30\.216|data-version="[^"]+"|/android/post-download/[0-9]+' /tmp/u.html | sort -u | head -8
          done
          echo "== versions page"
          curl -s -o /tmp/uv.html -w "  %{http_code}\n" -A "Mozilla/5.0 Chrome/131" --max-time 30 "https://youtube.en.uptodown.com/android/versions"
          grep -oE '21\.30\.216|21\.4[0-9]+\.[0-9]+' /tmp/uv.html | sort -u | head -10
