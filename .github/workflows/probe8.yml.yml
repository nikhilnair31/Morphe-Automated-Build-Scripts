name: Build Morphe + De-ReVanced Apps

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 6 */2 * *"   # Every 2 days at 06:00 UTC
  workflow_dispatch:
    inputs:
      app:
        description: "App to build (or 'all' for auto-detection)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - youtube
          - music
          - reddit
          - tiktok
          - tiktok_jp
          - twitch
          - facebook
          - messenger
          - threads
          - disney_plus
          - soundcloud
          - strava
          - tumblr
          - amazon_shop
          - amazon_music
          - google_photos
          - google_news
          - google_rec
          - proton_mail
          - viber
          - letterboxd
          - pixiv
          - cricbuzz
          - bandcamp
          - rar
          - photomath
          - peacock_tv
          - nothing_x
          - inshorts
          - icon_studio
          - hex_editor
          - gmx_mail
          - angulus
          - irplus
          - nu_nl
          - twitter
          - instagram
          - adguard
          - prime_video
          - duolingo
          - myfitnesspal
          - nova_launcher
          - solid_explorer
          - xodo_pdf
          - ibis_paint
          - wps_office
          - camscanner
          - fotmob
          - pandora
          - podcast_addict
          - proton_vpn
          - windy
          - sofascore
      version_override:
        description: "Force a specific version (e.g. 19.16.39) — leave empty for latest supported"
        required: false
        default: ""
      arch:
        description: "Target architecture"
        required: true
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
      force_all:
        description: "Rebuild every app in one job regardless of version diff (only with app=all — ignore concurrent per-app dispatches, they race on the shared release)"
        required: false
        default: false
        type: boolean

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Detect which apps need a build
  # ─────────────────────────────────────────────────────────────
  check-versions:
    name: "Check for new supported versions"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      any_needs_build:  ${{ steps.check.outputs.any_needs_build }}
      apps_to_build:    ${{ steps.check.outputs.apps_to_build }}
      morphe_tag:       ${{ steps.check.outputs.morphe_tag }}
      de_revanced_tag:  ${{ steps.check.outputs.de_revanced_tag }}
      de_vanced_tag:    ${{ steps.check.outputs.de_vanced_tag }}
      piko_tag:         ${{ steps.check.outputs.piko_tag }}
      hoodles_tag:      ${{ steps.check.outputs.hoodles_tag }}
      cli_tag:          ${{ steps.check.outputs.cli_tag }}
      morphe_mpp:       ${{ steps.check.outputs.morphe_mpp }}
      de_revanced_mpp:  ${{ steps.check.outputs.de_revanced_mpp }}
      de_vanced_mpp:    ${{ steps.check.outputs.de_vanced_mpp }}
      piko_mpp:         ${{ steps.check.outputs.piko_mpp }}
      hoodles_mpp:      ${{ steps.check.outputs.hoodles_mpp }}
      cli_jar:          ${{ steps.check.outputs.cli_jar }}
      target_arch:      ${{ steps.check.outputs.target_arch }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.x" }
      - uses: actions/setup-java@v5
        with: { distribution: "zulu", java-version: "21" }

      - name: Install dependencies
        run: pip install -q requests beautifulsoup4

      - name: Run version check
        id: check
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          SKIP_CLEANUP:     "true"
          MANUAL_APP:       ${{ github.event.inputs.app || 'all' }}
          MANUAL_VERSION:   ${{ github.event.inputs.version_override || '' }}
          TARGET_ARCH:      ${{ github.event.inputs.arch || 'arm64-v8a' }}
          FORCE_ALL:        ${{ github.event.inputs.force_all || 'false' }}
        run: python scripts/check_updates.py

      - name: Apps queued for build
        run: |
          echo '${{ steps.check.outputs.apps_to_build }}' \
            | python3 -c "
          import json, sys
          apps = json.load(sys.stdin)
          if apps:
              for a in apps:
                  print(f\"  {a['key']:20} {a['version']}\")
          else:
              print('  Nothing changed.')
          "

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Build changed apps and publish release
  # ─────────────────────────────────────────────────────────────
  build-and-release:
    name: "Build & Release"
    needs: check-versions
    if: needs.check-versions.outputs.any_needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - run: echo stub
